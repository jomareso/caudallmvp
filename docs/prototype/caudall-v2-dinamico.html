<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caudall v2.0 — Prototipo dinámico completo</title>
<style>
:root{
  --yale:#0F5499; --cola:#0783D9; --picton:#34C1EE;
  --quartz:#4B4C4C; --nickel:#737373; --silver:#B8B8B8;
  --bg:#F4F5F7; --surface:#ECEEF1; --white:#FFFFFF;
  --border:#D8DBDF; --border-strong:#B8B8B8;
  --radius-md:8px; --radius-lg:12px; --radius-xl:16px;
  --ok:#3B6D11; --warn:#854F0B; --bad:#791F1F;
  --ok-bg:#EAF3DE; --warn-bg:#FAEEDA; --bad-bg:#FCEBEB; --info-bg:#E6F1FB;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--quartz);line-height:1.5;padding:20px 12px}
.wrap{max-width:1100px;margin:0 auto}
.title{text-align:center;margin-bottom:6px}
.title h1{font-size:22px;font-weight:500;color:var(--yale)}
.title p{font-size:12px;color:var(--nickel);margin-top:4px}
.title .demo{display:inline-block;background:var(--info-bg);color:#0C447C;font-size:11px;padding:3px 10px;border-radius:8px;margin-top:6px}
.viewtabs{display:flex;gap:6px;margin:18px 0 14px;flex-wrap:wrap}
.vtab{flex:1;min-width:150px;padding:10px 12px;border:0.5px solid var(--border-strong);border-radius:8px;background:transparent;cursor:pointer;font-size:13px;font-family:inherit;color:var(--nickel)}
.vtab.on{background:var(--yale);color:#fff;border-color:var(--yale)}
.vtab small{display:block;font-size:10px;opacity:.8;margin-top:2px}
.frame{background:var(--surface);border-radius:12px;padding:18px}
.view{display:none}
.view.on{display:block}
.progressbar{max-width:380px;margin:0 auto 10px;display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--border-strong);cursor:pointer;border:none;padding:0}
.pdot.on{background:var(--yale);width:20px;border-radius:4px}
.pdot.done{background:var(--cola)}
.resetbar{max-width:320px;margin:12px auto 0;text-align:center}
.resetlink{background:none;border:none;color:var(--nickel);font-size:11px;cursor:pointer;text-decoration:underline;font-family:inherit;padding:6px}
.phone{max-width:340px;margin:0 auto;background:var(--white);border:0.5px solid var(--border-strong);border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(15,84,153,0.08)}
.bar{background:var(--yale);color:#fff;padding:10px 14px;font-size:13px;display:flex;align-items:center;justify-content:space-between}
.bar .co{display:flex;align-items:center;gap:6px}
.bar .co-logo{width:20px;height:20px;background:#fff;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--yale);font-weight:500}
.bar .back{background:none;border:none;color:#fff;cursor:pointer;font-size:14px;padding:0}
.bodyp{padding:18px 16px;min-height:500px;display:flex;flex-direction:column}
.h{font-size:16px;font-weight:500;margin:0 0 5px;color:var(--quartz)}
.sub{font-size:13px;color:var(--nickel);margin:0 0 14px}
.input{border:0.5px solid var(--border-strong);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--quartz);margin-bottom:9px;background:#fff;width:100%;font-family:inherit}
.opt{border:0.5px solid var(--border-strong);border-radius:8px;padding:11px 12px;font-size:13px;margin-bottom:8px;color:var(--nickel);display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.opt:hover{border-color:var(--cola);color:var(--quartz)}
.opt.sel{border-color:var(--cola);color:var(--yale);background:var(--info-bg)}
.opt-radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--silver);flex-shrink:0}
.opt.sel .opt-radio{border-color:var(--yale);background:var(--yale);box-shadow:inset 0 0 0 3px #fff}
.btn{background:var(--yale);color:#fff;border:none;border-radius:8px;padding:11px;font-size:13px;width:100%;text-align:center;font-family:inherit;cursor:pointer;margin-top:auto}
.btn.ghost{background:transparent;color:var(--cola);border:0.5px solid var(--cola)}
.btn.g{background:#fff;color:var(--yale);border:0.5px solid var(--border-strong)}
.trust-note{background:var(--info-bg);border-radius:8px;padding:9px 10px;font-size:11px;color:#0C447C;margin:11px 0;display:flex;gap:7px;align-items:flex-start}
.condicional-note{background:#F5EFDD;border-radius:8px;padding:8px 10px;font-size:10px;color:#7A5C0F;margin-bottom:10px;line-height:1.4}
.icon-c{width:52px;height:52px;border-radius:50%;background:var(--info-bg);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:var(--yale);font-size:22px}
.icon-c.ok{background:var(--ok-bg);color:var(--ok)}
.proghead{display:flex;justify-content:space-between;font-size:11px;color:var(--nickel);margin-bottom:5px}
.prog{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin:0 0 14px}
.prog span{display:block;height:100%;background:linear-gradient(90deg,var(--picton),var(--cola))}
.dimchip{display:inline-block;font-size:10px;padding:2px 8px;border-radius:8px;background:var(--info-bg);color:#0C447C;margin-bottom:8px;font-weight:500}
.benchmark{display:flex;height:32px;border-radius:8px;overflow:hidden;font-size:9px;position:relative}
.dim-card{border:0.5px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;background:#fff}
.dim-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:5px}
.dim-head b{font-weight:500;color:var(--quartz)}
.bars{height:8px;background:var(--border);border-radius:5px;overflow:hidden}
.bars span{display:block;height:100%}
.tag{font-size:10px;padding:3px 8px;border-radius:8px}
.t-critical{background:#FCEBEB;color:#791F1F}
.t-atrisk{background:#FCDDC7;color:#7A3A0A}
.t-building{background:var(--warn-bg);color:var(--warn)}
.t-healthy{background:var(--ok-bg);color:var(--ok)}
.t-optimal{background:#DDEDC5;color:#2A4E0B}
.action-card{border:1px solid var(--cola);border-radius:8px;padding:12px;margin-bottom:10px;background:#fff}
.action-card .why{font-size:11px;color:var(--nickel);margin-top:8px;padding-top:8px;border-top:0.5px dashed var(--border)}
.action-card .type-badge{font-size:9px;background:var(--info-bg);color:#0C447C;padding:2px 6px;border-radius:8px;display:inline-block;margin-bottom:6px}
.intv{display:flex;gap:9px;align-items:flex-start;border:0.5px solid var(--border);border-radius:8px;padding:10px;margin-bottom:7px;font-size:12px;color:var(--nickel);cursor:pointer;background:#fff}
.intv .ic{flex-shrink:0;width:26px;height:26px;border-radius:5px;background:var(--info-bg);color:var(--yale);display:flex;align-items:center;justify-content:center;font-size:13px}
.intv b{font-weight:500;color:var(--quartz)}
.desk{background:var(--white);border:0.5px solid var(--border-strong);border-radius:8px;overflow:hidden;max-width:940px;margin:0 auto;box-shadow:0 4px 20px rgba(15,84,153,0.08)}
.deskhdr{background:var(--yale);color:#fff;padding:12px 18px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.deskhdr .co-badge{background:rgba(255,255,255,.15);padding:3px 8px;border-radius:8px;font-size:11px;margin-left:10px}
.desknav{background:#F9FAFB;border-bottom:0.5px solid var(--border);padding:0 18px;display:flex;font-size:12px;overflow-x:auto}
.desknav a{padding:11px 14px;color:var(--nickel);text-decoration:none;border-bottom:2px solid transparent;cursor:pointer;user-select:none;white-space:nowrap}
.desknav a.on{color:var(--yale);border-bottom-color:var(--yale);font-weight:500}
.deskbody{padding:20px;min-height:520px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.metric{background:var(--surface);border-radius:8px;padding:14px}
.mlbl{font-size:11px;color:var(--nickel);margin:0 0 5px}
.mval{font-size:24px;font-weight:500;margin:0;color:var(--quartz)}
.msub{font-size:10px;color:var(--nickel);margin-top:3px}
.msub.ok{color:var(--ok)}
.msub.bad{color:var(--bad)}
.section-title{font-size:13px;font-weight:500;color:var(--quartz);margin:18px 0 10px}
.dim-mini{background:var(--surface);border-radius:8px;padding:12px;text-align:center;cursor:pointer}
.dim-mini .name{font-size:11px;color:var(--nickel);margin-bottom:4px}
.dim-mini .val{font-size:22px;font-weight:500;color:var(--yale)}
.dim-mini .status{font-size:9px;padding:2px 6px;border-radius:8px;margin-top:5px;display:inline-block}
.threshold-notice{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:11px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
.chart-fake{background:linear-gradient(180deg,#fff 0%,var(--info-bg) 100%);border:0.5px solid var(--border);border-radius:8px;height:200px;display:flex;align-items:flex-end;justify-content:space-around;padding:15px 20px 22px;position:relative}
.chart-fake .bar-c{width:34px;background:var(--yale);border-radius:4px 4px 0 0;position:relative}
.chart-fake .bar-c::after{content:attr(data-lbl);position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--nickel);white-space:nowrap}
.chart-fake .bar-c::before{content:attr(data-val);position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--quartz);font-weight:500}
.alert-box{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:12px;font-size:12px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
.alert-box.warn{background:var(--warn-bg);color:var(--warn)}
.alert-box.info{background:var(--info-bg);color:#0C447C}
.alert-box b{font-weight:500;display:block;margin-bottom:3px}
.info-box{background:var(--info-bg);border-radius:8px;padding:11px;font-size:12px;color:#0C447C;margin:12px 0;line-height:1.5}
.info-box b{font-weight:500}
.admin-side{display:grid;grid-template-columns:200px 1fr;min-height:520px}
.admin-nav{background:#0C447C;color:#fff;padding:18px 0}
.admin-nav .grp{font-size:10px;color:rgba(255,255,255,.5);text-transform:uppercase;padding:14px 18px 6px;letter-spacing:0.5px}
.admin-nav a{display:block;padding:9px 18px;font-size:12px;color:rgba(255,255,255,.85);text-decoration:none;cursor:pointer;border-left:3px solid transparent;user-select:none}
.admin-nav a.on{background:rgba(255,255,255,.1);border-left-color:var(--picton);color:#fff}
.admin-body{padding:20px}
.entity-table{width:100%;border-collapse:collapse;font-size:12px}
.entity-table th{text-align:left;color:var(--nickel);font-weight:500;padding:8px 10px;border-bottom:0.5px solid var(--border-strong);font-size:11px}
.entity-table td{padding:9px 10px;border-bottom:0.5px solid var(--border);color:var(--quartz)}
.status-chip{font-size:10px;padding:2px 7px;border-radius:8px}
.status-chip.active{background:var(--ok-bg);color:var(--ok)}
.status-chip.draft{background:var(--warn-bg);color:var(--warn)}
.tree{font-size:12px;font-family:'Courier New',monospace;color:var(--quartz);line-height:1.7;background:var(--surface);border-radius:8px;padding:12px}
.tree .k{color:var(--yale);font-weight:500}
.tree .n{color:var(--nickel)}
.foot{text-align:center;font-size:11px;color:var(--silver);margin-top:22px;line-height:1.7}
.foot b{color:var(--nickel);font-weight:500}
@media (max-width:640px){
  .grid-3,.grid-2,.grid-4,.grid-5{grid-template-columns:1fr 1fr}
  .admin-side{grid-template-columns:1fr}
  .admin-nav{padding:10px 0}
}
</style>
</head>
<body>
<div class="wrap">

<div class="title">
  <h1>caudall</h1>
  <p>Prototipo del MVP v2.0 &middot; Modelo B2B2E &middot; <b>puntaje din&aacute;mico</b></p>
  <span class="demo">El CFHI cambia seg&uacute;n tus respuestas &middot; 3 vistas: Empleado / RRHH / Admin</span>
</div>

<div class="viewtabs">
  <button class="vtab on" onclick="setView('emp')" id="tab-emp">Empleado <small>diagnóstico dinámico</small></button>
  <button class="vtab" onclick="setView('rrhh')" id="tab-rrhh">RRHH <small>panel de la empresa</small></button>
  <button class="vtab" onclick="setView('admin')" id="tab-admin">Admin Caudall <small>metodología v2.0</small></button>
</div>

<div class="frame">

<div class="view on" id="view-emp">
  <div class="progressbar" id="dots-emp"></div>
  <div id="emp-container"></div>
  <div class="resetbar"><button class="resetlink" onclick="resetView('emp')">↺ Reiniciar demo del empleado</button></div>
</div>

<div class="view" id="view-rrhh">
  <div class="progressbar" id="dots-rrhh"></div>
  <div id="rrhh-container"></div>
  <div class="resetbar"><button class="resetlink" onclick="resetView('rrhh')">↺ Reiniciar demo de RRHH</button></div>
</div>

<div class="view" id="view-admin">
  <div class="progressbar" id="dots-admin"></div>
  <div id="admin-container"></div>
  <div class="resetbar"><button class="resetlink" onclick="resetView('admin')">↺ Reiniciar demo del admin</button></div>
</div>

</div>

<p class="foot"><b>Caudall v2.0 &middot; Modelo B2B2E</b><br>Puntaje din&aacute;mico &middot; 5 dimensiones ponderadas &middot; Next Best Action adaptativo</p>

</div>

<script>
// ===============================================
// DATOS
// ===============================================
var questions = [
  {id:'q1', dim:'ctrl', dimName:'Control', text:'¿Tus ingresos son regulares mes a mes?', options:[
    {t:'Sí, muy estables', s:100},
    {t:'Estables pero con pequeñas variaciones', s:80},
    {t:'Varían bastante mes a mes', s:45},
    {t:'Muy variables o impredecibles', s:15}
  ]},
  {id:'q2', dim:'ctrl', dimName:'Control', text:'¿Sabes con precisión cuánto gastaste el mes pasado?', options:[
    {t:'Sí, hasta el detalle', s:100},
    {t:'Sí, en categorías generales', s:75},
    {t:'Tengo una idea aproximada', s:45},
    {t:'No sabría decir con certeza', s:10}
  ]},
  {id:'q3', dim:'res', dimName:'Resiliencia', text:'Si perdieras tu ingreso mañana, ¿por cuánto tiempo podrías cubrir tus gastos con lo que tienes ahorrado?', options:[
    {t:'Más de 6 meses', s:100},
    {t:'De 3 a 6 meses', s:80},
    {t:'De 1 a 3 meses', s:55},
    {t:'Menos de un mes', s:25},
    {t:'No tengo nada ahorrado', s:0}
  ]},
  {id:'q4', dim:'res', dimName:'Resiliencia', text:'Ante una emergencia médica seria, ¿estarías cubierto?', options:[
    {t:'Sí, tengo seguro que cubre bien', s:100},
    {t:'Solo el ARS del trabajo', s:55},
    {t:'Tengo seguro pero no sé qué cubre', s:40},
    {t:'No tengo cobertura', s:5}
  ]},
  {id:'q5', dim:'debt', dimName:'Deuda', text:'De cada RD$100 que ganas al mes, ¿cuánto se va en pagar deudas?', options:[
    {t:'Nada, no tengo deudas', s:100},
    {t:'Menos de RD$20', s:85},
    {t:'Entre RD$20 y RD$40', s:60},
    {t:'Entre RD$40 y RD$60', s:25},
    {t:'Más de RD$60', s:5}
  ]},
  {id:'q6', dim:'debt', dimName:'Deuda', text:'En los últimos 12 meses, ¿te has atrasado en algún pago de deuda?', options:[
    {t:'Nunca', s:100},
    {t:'Una vez puntual', s:70},
    {t:'Varias veces, pero ya al día', s:30},
    {t:'Estoy con atraso vigente ahora', s:5}
  ]},
  {id:'q7', dim:'debt', dimName:'Deuda', text:'Si tienes tarjetas de crédito, ¿cómo las pagas normalmente?', options:[
    {t:'Pago el saldo total cada mes', s:100},
    {t:'Más del mínimo pero menos del total', s:60},
    {t:'Solo el pago mínimo', s:15},
    {t:'No tengo tarjetas de crédito', s:85}
  ]},
  {id:'q8', dim:'sav', dimName:'Ahorro', text:'¿Logras ahorrar parte de tus ingresos regularmente?', options:[
    {t:'Sí, todos los meses', s:100},
    {t:'La mayoría de los meses', s:75},
    {t:'A veces, cuando puedo', s:45},
    {t:'Casi nunca', s:20},
    {t:'Nunca, no tengo margen', s:0}
  ]},
  {id:'q9', dim:'sav', dimName:'Ahorro', text:'¿Qué te impide ahorrar de forma más consistente?', conditional:true, options:[
    {t:'Ingresos que varían mes a mes', s:55},
    {t:'Gastos imprevistos', s:50},
    {t:'No tengo un sistema para hacerlo', s:40},
    {t:'Otras prioridades más urgentes', s:30}
  ]},
  {id:'q10', dim:'plan', dimName:'Planificación', text:'¿Tienes definidas metas financieras a mediano o largo plazo?', options:[
    {t:'Sí, con plazos y montos claros', s:100},
    {t:'Tengo ideas generales pero no específicas', s:55},
    {t:'Pensé en algún momento pero no ahora', s:25},
    {t:'No he pensado en metas financieras', s:5}
  ]},
  {id:'q11', dim:'plan', dimName:'Planificación', text:'¿Estás aportando activamente a tu retiro (AFP o pensión)?', options:[
    {t:'Sí, AFP más aportes voluntarios', s:100},
    {t:'Solo lo que descuenta mi empleador', s:55},
    {t:'A veces cotizo, a veces no', s:25},
    {t:'No estoy cotizando actualmente', s:5}
  ]}
];

var dimensions = {ctrl:'Control', res:'Resiliencia', debt:'Deuda', sav:'Ahorro', plan:'Planificación'};

var nbaByDim = {
  ctrl:{title:'Empieza a registrar tus gastos diarios por 2 semanas', desc:'Anota cada gasto por 14 días. En 2 semanas tendrás claridad sobre a dónde se va tu dinero.', why:'Tu dimensión más débil es Control. Sin saber dónde va tu dinero, es imposible cambiarlo.', m1:'Curso: Cómo registrar gastos sin agobiarte', m1t:'8 min', m2:'Artículo: El presupuesto que sí funciona', m2t:'5 min'},
  res:{title:'Empieza tu fondo de emergencia con RD$500 esta semana', desc:'Abre una cuenta separada solo para emergencias. Deposita RD$500. La meta es llegar a 3 meses de gastos.', why:'Tu dimensión más débil es Resiliencia. Sin fondo, cualquier imprevisto te empuja a la deuda.', m1:'Curso: Fondo de emergencia en 3 pasos', m1t:'8 min', m2:'Artículo: Cuánto es "suficiente"', m2t:'4 min'},
  debt:{title:'Lista todas tus deudas de mayor a menor tasa', desc:'Anota cada deuda: monto, cuota, tasa. Ordénalas de mayor tasa a menor. Empezar por la más costosa ahorra más dinero.', why:'Tu dimensión más débil es Deuda. Sin claridad del panorama total, es fácil pagar la más ruidosa en vez de la más cara.', m1:'Curso: Ordenar tus deudas en 3 pasos', m1t:'10 min', m2:'Artículo: Método avalancha vs bola de nieve', m2t:'6 min'},
  sav:{title:'Automatiza un ahorro semanal pequeño', desc:'RD$500 cada viernes por transferencia automática. Menos importa el monto que la consistencia. En un año son RD$26,000 sin pensarlo.', why:'Tu dimensión más débil es Ahorro. Automatizar antes de gastar te protege del impulso.', m1:'Curso: Ahorro automático en 15 minutos', m1t:'8 min', m2:'Artículo: Por qué el ahorro pequeño gana', m2t:'4 min'},
  plan:{title:'Define UNA meta financiera con plazo y monto', desc:'Elige una sola meta. Ejemplo: "Ahorrar RD$50,000 para viaje en 12 meses". Específica, con fecha, con monto.', why:'Tu dimensión más débil es Planificación. Las metas vagas no se cumplen — las específicas sí.', m1:'Curso: Metas SMART para tu dinero', m1t:'7 min', m2:'Artículo: Retiro sin miedo', m2t:'5 min'}
};

// ===============================================
// ESTADO
// ===============================================
var answers = {};
var currentScreen = {emp:0, rrhh:0, admin:0};
var totalScreens = {emp:16, rrhh:8, admin:5};

// ===============================================
// SCORING
// ===============================================
function dimScore(dim){
  var qs = questions.filter(function(q){return q.dim===dim;});
  var vals = qs.map(function(q){return answers[q.id];}).filter(function(v){return v!==undefined;});
  if(vals.length===0) return 0;
  var sum = 0;
  for(var i=0;i<vals.length;i++) sum += vals[i];
  return Math.round(sum/vals.length);
}

function cfhi(){
  var dims = ['ctrl','res','debt','sav','plan'];
  var sum = 0;
  for(var i=0;i<dims.length;i++) sum += dimScore(dims[i]);
  return Math.round(sum/dims.length);
}

function bandInfo(s){
  if(s<=30) return {name:'Crítico',cls:'t-critical',msg:'Tu salud financiera necesita atención urgente. Con acciones concretas puedes empezar a estabilizarte en las próximas semanas.'};
  if(s<=50) return {name:'En riesgo',cls:'t-atrisk',msg:'Estás en un rango de vulnerabilidad. Con foco en tus 2 dimensiones más débiles puedes salir del riesgo en 3-6 meses.'};
  if(s<=70) return {name:'En construcción',cls:'t-building',msg:'Estás en un punto medio. Con acciones concretas puedes subir a "Saludable" en los próximos 6 meses.'};
  if(s<=85) return {name:'Saludable',cls:'t-healthy',msg:'Tu salud financiera es sólida. Mantén tus prácticas y afina donde puedes crecer más.'};
  return {name:'Óptimo',cls:'t-optimal',msg:'Tu salud financiera es excelente. Estás en el 10% más alto de dominicanos.'};
}

function barColor(s){
  if(s<=30) return '#E24B4A';
  if(s<=50) return '#F07935';
  if(s<=70) return '#EF9F27';
  if(s<=85) return '#97C459';
  return '#5A9B0F';
}

function dimDesc(dim, s){
  var t = {
    high:{ctrl:'Sabes tus gastos y manejas tu día a día bien.',res:'Tienes un colchón sólido.',debt:'Tu carga de deuda es manejable.',sav:'Ahorras de forma consistente.',plan:'Tienes metas claras.'},
    mid:{ctrl:'Tienes noción general pero podrías afinar el detalle.',res:'Tienes algún colchón pero bajo lo recomendado.',debt:'Tu deuda es manejable pero mereces afinarla.',sav:'Ahorras pero no siempre.',plan:'Tienes intención pero falta concretar.'},
    low:{ctrl:'Falta claridad sobre a dónde va tu dinero.',res:'Tu colchón es insuficiente.',debt:'Tu carga te está presionando.',sav:'Ahorras rara vez. Tu principal área.',plan:'Falta definir metas concretas.'},
    crit:{ctrl:'Sin visibilidad de tus gastos, es difícil avanzar.',res:'Sin colchón, cualquier imprevisto te empuja a deuda.',debt:'Tu deuda está en niveles críticos.',sav:'Sin ahorro, no hay colchón.',plan:'Sin metas, no hay dirección.'}
  };
  if(s>=71) return t.high[dim];
  if(s>=51) return t.mid[dim];
  if(s>=31) return t.low[dim];
  return t.crit[dim];
}

function weakestDim(){
  var dims = ['ctrl','res','debt','sav','plan'];
  var min = 999, minDim = 'sav';
  for(var i=0;i<dims.length;i++){
    var s = dimScore(dims[i]);
    if(s<min){min=s;minDim=dims[i];}
  }
  return minDim;
}

// ===============================================
// NAVEGACIÓN
// ===============================================
function renderDots(view){
  var wrap = document.getElementById('dots-'+view);
  var total = totalScreens[view];
  var current = currentScreen[view];
  var html = '';
  for(var i=0;i<total;i++){
    var cls = 'pdot';
    if(i===current) cls += ' on';
    else if(i<current) cls += ' done';
    html += '<button class="'+cls+'" onclick="goToScreen(\''+view+'\','+i+')"></button>';
  }
  wrap.innerHTML = html;
}

function goToScreen(view, i){
  if(i<0 || i>=totalScreens[view]) return;
  currentScreen[view] = i;
  if(view==='emp') renderEmpScreen(i);
  else if(view==='rrhh') renderRrhhScreen(i);
  else if(view==='admin') renderAdminScreen(i);
  renderDots(view);
  var frame = document.querySelector('.frame');
  if(frame) frame.scrollIntoView({behavior:'smooth', block:'start'});
}

function nextEmp(){ goToScreen('emp', currentScreen.emp+1); }
function prevEmp(){ goToScreen('emp', currentScreen.emp-1); }
function nextRrhh(){ goToScreen('rrhh', currentScreen.rrhh+1); }
function goRrhh(i){ goToScreen('rrhh', i); }
function nextAdmin(){ goToScreen('admin', currentScreen.admin+1); }
function goAdmin(i){ goToScreen('admin', i); }

function resetView(view){
  if(view==='emp') answers = {};
  goToScreen(view, 0);
}

function setView(v){
  document.getElementById('view-emp').classList.remove('on');
  document.getElementById('view-rrhh').classList.remove('on');
  document.getElementById('view-admin').classList.remove('on');
  document.getElementById('view-'+v).classList.add('on');
  document.getElementById('tab-emp').classList.remove('on');
  document.getElementById('tab-rrhh').classList.remove('on');
  document.getElementById('tab-admin').classList.remove('on');
  document.getElementById('tab-'+v).classList.add('on');
}

function pickAnswer(qid, score, el){
  answers[qid] = score;
  var siblings = el.parentElement.querySelectorAll('.opt');
  for(var i=0;i<siblings.length;i++){
    siblings[i].classList.remove('sel');
  }
  el.classList.add('sel');
}

function requireAndNext(qid){
  if(answers[qid]===undefined){
    alert('Por favor selecciona una opción antes de continuar.');
    return;
  }
  nextEmp();
}
